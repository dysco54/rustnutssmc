<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon | Rustnuts SMC</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet" />

<style>
  :root{
    --red:#8C1C24;
    --red-bright:#B92632;
    --ink:#111010;
    --bone:#F4F1EA;
    --bone-dim:#d8d3c7;
    --stencil:"Saira Stencil One","Arial Black","Helvetica Neue",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Helvetica Neue",Arial,sans-serif;
    background:var(--ink);
    color:var(--bone);
    line-height:1.6;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:28px;
    background:
      radial-gradient(circle at 72% 38%, rgba(140,28,36,0.28), transparent 55%),
      radial-gradient(circle at 20% 80%, rgba(140,28,36,0.14), transparent 50%),
      var(--ink);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:48px}
  .brand img{height:48px;width:auto;display:block;border-radius:4px}
  .brand span{
    font-family:var(--stencil);font-weight:400;letter-spacing:0.06em;font-size:1.2rem;
  }
  h1{
    font-family:var(--stencil);font-weight:400;text-transform:uppercase;
    letter-spacing:0.01em;line-height:0.96;
    font-size:clamp(2.4rem,8vw,4.5rem);
    color:transparent;-webkit-text-stroke:2px var(--bone);
    margin-bottom:18px;
  }
  h1 .fill{color:var(--red-bright);-webkit-text-stroke:0}
  p{color:var(--bone-dim);max-width:40ch;margin:0 auto 34px;font-size:1.05rem}
  .btn{
    display:inline-block;padding:15px 30px;font-weight:800;
    text-transform:uppercase;letter-spacing:0.08em;font-size:0.85rem;
    text-decoration:none;border-radius:3px;transition:transform .15s, background .2s;
    border:2px solid var(--bone-dim);color:var(--bone);
  }
  .btn:hover{border-color:var(--red-bright);color:var(--red-bright);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="brand">
    <img src="rustnuts-smc-logo.jpg" alt="Rustnuts SMC logo" />
    <span>RUSTNUTS&nbsp;SMC</span>
  </div>
  <h1><span class="fill">Coming</span><br />Soon</h1>
  <p>This page is still being built. Check back soon, or head back to the main site.</p>
  <a href="index.html" class="btn">Back To Home</a>
</body>
</html>
